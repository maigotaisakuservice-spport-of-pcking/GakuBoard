<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Passkey Demo (WebAuthn)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    .log {
      margin-top: 16px;
      font-size: 12px;
      background: #eee;
      padding: 8px;
      border-radius: 6px;
      height: 80px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 パスキーデモ</h2>

    <button onclick="registerPasskey()">パスキー登録</button>
    <button onclick="loginPasskey()">パスキーログイン</button>

    <div class="log" id="log"></div>
  </div>

<script>
const log = (msg) => {
  document.getElementById("log").textContent += msg + "\n";
};

// ダミー challenge
const randomBuffer = (len = 32) =>
  Uint8Array.from(crypto.getRandomValues(new Uint8Array(len)));

async function registerPasskey() {
  try {
    const publicKey = {
      challenge: randomBuffer(),
      rp: { name: "Passkey Demo" },
      user: {
        id: randomBuffer(16),
        name: "demo@example.com",
        displayName: "Demo User",
      },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }],
      authenticatorSelection: {
        residentKey: "preferred",
        userVerification: "preferred"
      },
      timeout: 60000,
      attestation: "none",
    };

    const credential = await navigator.credentials.create({
      publicKey
    });

    log("✅ パスキー登録成功");
    console.log(credential);
  } catch (e) {
    log("❌ 登録失敗: " + e.message);
  }
}

async function loginPasskey() {
  try {
    const publicKey = {
      challenge: randomBuffer(),
      timeout: 60000,
      userVerification: "preferred",
    };

    const assertion = await navigator.credentials.get({
      publicKey
    });

    log("✅ ログイン成功");
    console.log(assertion);
  } catch (e) {
    log("❌ ログイン失敗: " + e.message);
  }
}
</script>
</body>
</html>
