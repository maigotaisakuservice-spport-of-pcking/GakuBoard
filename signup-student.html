<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board | 生徒アカウント有効化 (Signup)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .signup-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .form-control { margin-bottom: 15px; width: 90%; }
        .error-msg { color: #e74c3c; margin-top: 10px; font-size: 0.9em; }
    </style>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>

    <div class="signup-container">
        <h2><i class="fas fa-user-plus"></i> 生徒アカウント登録</h2>
        <p>管理者から登録されたメールアドレスを使ってパスワードを設定します。</p>

        <input type="text" id="tenantId" class="form-control" placeholder="学校コード (例: SCHOOL001)">
        <input type="email" id="email" class="form-control" placeholder="登録済みメールアドレス">
        <input type="password" id="password" class="form-control" placeholder="設定するパスワード (6文字以上)">

        <button onclick="signupStudent()" class="btn btn-primary" style="width:100%">登録する</button>
        <p class="error-msg" id="errorMsg"></p>

        <div style="margin-top:20px;">
            <a href="student-login.html">すでにアカウントをお持ちの方はこちら</a>
        </div>
    </div>

    <script>
        async function signupStudent() {
            const tenantId = document.getElementById('tenantId').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if(!tenantId || !email || !password) {
                errorMsg.textContent = "全ての項目を入力してください";
                return;
            }

            try {
                // 1. Verify User is Pre-registered
                const snapshot = await db.collection('users')
                    .where('email', '==', email)
                    .where('tenantId', '==', tenantId)
                    .get();

                if(snapshot.empty) {
                    errorMsg.textContent = "このメールアドレスは登録されていません。学校コードが正しいか確認してください。";
                    return;
                }

                const userDoc = snapshot.docs[0];
                if (userDoc.data().role !== 'student') {
                    errorMsg.textContent = "生徒用のアドレスではありません。";
                    return;
                }

                // 2. Create Auth User
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 3. Update Firestore Doc with UID (Link)
                await db.collection('users').doc(user.uid).set({
                    ...userDoc.data(),
                    uid: user.uid,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Cleanup old doc if ID was different
                if (userDoc.id !== user.uid) {
                    await db.collection('users').doc(userDoc.id).delete();
                }

                alert("登録完了しました！");
                window.location.href = 'student-main-hub.html';

            } catch (e) {
                console.error(e);
                errorMsg.textContent = "エラー: " + e.message;
            }
        }
    </script>
</body>
</html>
