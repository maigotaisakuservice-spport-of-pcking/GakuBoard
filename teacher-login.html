<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board | 先生ログイン</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #2ecc71; /* Teacher color */
        }
        .step-container {
            display: none;
        }
        .step-container.active {
            display: block;
        }
        .school-id-input {
            font-size: 1.2em;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1em;
            transition: opacity 0.2s;
        }
        .auth-btn:hover { opacity: 0.9; }
        .btn-google { background-color: #db4437; color: white; }
        .btn-microsoft { background-color: #2f2f2f; color: white; }
        .btn-email { background-color: #00b894; color: white; }

        .error-msg { color: #e74c3c; margin-top: 10px; font-size: 0.9em; }
    </style>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>

    <div class="login-container">
        <h2><i class="fas fa-chalkboard-teacher"></i> 先生ログイン</h2>

        <!-- Step 1: Tenant ID -->
        <div id="step1" class="step-container active">
            <p>学校コード(テナントID)を入力してください</p>
            <div class="form-group">
                <input type="text" id="tenantIdInput" class="form-control school-id-input" placeholder="SCHOOL001">
            </div>
            <button onclick="verifyTenant()" class="btn btn-primary" style="width:100%">次へ</button>
            <p class="error-msg" id="step1Error"></p>
        </div>

        <!-- Step 2: Auth Methods -->
        <div id="step2" class="step-container">
            <p id="schoolNameDisplay" style="font-weight:bold; color:#2c3e50;"></p>
            <p>ログイン方法を選択</p>

            <div id="authButtons">
                <!-- Buttons injected via JS -->
            </div>

            <button onclick="backToStep1()" class="btn btn-secondary" style="margin-top:20px; width:100%">戻る</button>
        </div>

        <!-- Email Form -->
        <div id="stepEmail" class="step-container">
             <h3>メールアドレスでログイン</h3>
             <input type="email" id="emailInput" class="form-control" placeholder="メールアドレス" style="margin-bottom:10px;">
             <input type="password" id="passInput" class="form-control" placeholder="パスワード" style="margin-bottom:10px;">
             <button onclick="handleEmailLogin()" class="btn btn-action" style="width:100%">ログイン</button>
             <button onclick="showStep2()" class="btn btn-secondary" style="margin-top:10px; width:100%">戻る</button>
             <p class="error-msg" id="emailError"></p>
        </div>
    </div>

    <script>
        let currentTenantId = '';

        async function verifyTenant() {
            const input = document.getElementById('tenantIdInput').value.trim();
            const errorParams = document.getElementById('step1Error');

            if(!input) {
                errorParams.textContent = "学校コードを入力してください";
                return;
            }

            try {
                const doc = await db.collection('tenants').doc(input).get();
                if (doc.exists) {
                    currentTenantId = input;
                    const data = doc.data();
                    document.getElementById('schoolNameDisplay').textContent = data.name;
                    setupAuthButtons(data.allowedAuth);

                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    errorParams.textContent = "";
                } else {
                    errorParams.textContent = "学校コードが見つかりません";
                }
            } catch (e) {
                console.error(e);
                errorParams.textContent = "エラーが発生しました";
            }
        }

        function setupAuthButtons(allowed) {
            const container = document.getElementById('authButtons');
            container.innerHTML = '';

            if (allowed.google) {
                const btn = document.createElement('button');
                btn.className = 'auth-btn btn-google';
                btn.innerHTML = '<i class="fab fa-google"></i> Googleでログイン';
                btn.onclick = () => handleProviderLogin(new firebase.auth.GoogleAuthProvider());
                container.appendChild(btn);
            }

            if (allowed.microsoft) {
                const btn = document.createElement('button');
                btn.className = 'auth-btn btn-microsoft';
                btn.innerHTML = '<i class="fab fa-microsoft"></i> Microsoftでログイン';
                btn.onclick = () => handleProviderLogin(new firebase.auth.OAuthProvider('microsoft.com'));
                container.appendChild(btn);
            }

            if (allowed.email) {
                const btn = document.createElement('button');
                btn.className = 'auth-btn btn-email';
                btn.innerHTML = '<i class="fas fa-envelope"></i> メールアドレスでログイン';
                btn.onclick = () => {
                    document.getElementById('step2').classList.remove('active');
                    document.getElementById('stepEmail').classList.add('active');
                };
                container.appendChild(btn);
            }
        }

        async function handleProviderLogin(provider) {
            try {
                const result = await auth.signInWithPopup(provider);
                checkUserAccess(result.user);
            } catch (e) {
                alert("認証エラー: " + e.message);
            }
        }

        async function handleEmailLogin() {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            try {
                const result = await auth.signInWithEmailAndPassword(email, pass);
                checkUserAccess(result.user);
            } catch (e) {
                document.getElementById('emailError').textContent = e.message;
            }
        }

        async function checkUserAccess(user) {
            // Check if user is linked to this tenant
            const userDoc = await db.collection('users').doc(user.uid).get();

            if (userDoc.exists) {
                const userData = userDoc.data();
                if (userData.tenantId === currentTenantId && (userData.role === 'teacher' || userData.role === 'admin')) {
                    window.location.href = 'teacher-main-hub.html';
                } else {
                    alert('この学校のアカウントではありません。または権限がありません。');
                    auth.signOut();
                }
            } else {
                // Check whitelist
                const snapshot = await db.collection('users')
                    .where('email', '==', user.email)
                    .where('tenantId', '==', currentTenantId)
                    .get();

                if (!snapshot.empty) {
                    const matchedDoc = snapshot.docs[0];
                    if (matchedDoc.data().role !== 'teacher' && matchedDoc.data().role !== 'admin') {
                         alert('あなたは先生アカウントではありません');
                         auth.signOut();
                         return;
                    }

                    await db.collection('users').doc(user.uid).set({
                        ...matchedDoc.data(),
                        uid: user.uid,
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    if (matchedDoc.id !== user.uid) {
                        await db.collection('users').doc(matchedDoc.id).delete();
                    }

                    window.location.href = 'teacher-main-hub.html';
                } else {
                    alert('登録されていません。管理者に問い合わせてください。');
                    auth.signOut();
                }
            }
        }

        function backToStep1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }

        function showStep2() {
            document.getElementById('stepEmail').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }
    </script>
</body>
</html>
