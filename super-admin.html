<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スーパー管理者画面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script> <!-- For logout -->
    <script src="js/admin-utils.js"></script> <!-- Admin Utils -->
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-800 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">GAKU-Board スーパー管理</h1>
        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded">ログアウト</button>
    </nav>

    <div class="container mx-auto p-8">
        <!-- Create Tenant Section -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <h2 class="text-2xl font-bold mb-4">新規テナント作成</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2">テナント名</label>
                    <input type="text" id="new-tenant-name" placeholder="例: 東京都教育委員会" class="w-full border p-2 rounded">
                </div>

                <div class="col-span-2 border-t pt-4 mt-2">
                    <h3 class="text-lg font-bold mb-2">テナント管理者作成 (同時作成)</h3>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">管理者名</label>
                    <input type="text" id="admin-name" placeholder="管理者 太郎" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">メールアドレス</label>
                    <input type="email" id="admin-email" placeholder="admin@example.com" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">パスワード</label>
                    <input type="text" id="admin-password" placeholder="パスワード" class="w-full border p-2 rounded">
                    <label class="inline-flex items-center mt-1">
                        <input type="checkbox" id="auto-generate-pass" class="form-checkbox h-4 w-4 text-blue-600" onchange="togglePasswordGen()">
                        <span class="ml-2 text-gray-600 text-sm">自動生成</span>
                    </label>
                </div>
                <div class="flex items-end">
                    <button onclick="createTenantWithAdmin()" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 w-full">テナント作成＆管理者登録</button>
                </div>
            </div>
        </div>

        <!-- Create Tenant Admin Direct Section -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <h2 class="text-2xl font-bold mb-4">既存テナントへの管理者追加</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <select id="tenant-select" class="border p-2 rounded">
                    <option value="">テナントを選択</option>
                </select>
                <input type="text" id="direct-admin-name" placeholder="名前" class="border p-2 rounded">
                <input type="email" id="direct-admin-email" placeholder="メールアドレス" class="border p-2 rounded">
                <div class="flex gap-2">
                    <input type="text" id="direct-admin-password" placeholder="パスワード" class="border p-2 rounded flex-grow">
                    <button onclick="document.getElementById('direct-admin-password').value = generatePassword()" class="bg-gray-200 px-2 rounded text-sm">生成</button>
                </div>
                <button onclick="addTenantAdminDirectly()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">管理者作成</button>
            </div>
        </div>

        <!-- Tenant List -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <h2 class="text-2xl font-bold mb-4">テナント一覧</h2>
            <ul id="tenant-list" class="divide-y divide-gray-200">
                <!-- List items here -->
            </ul>
        </div>

        <!-- Tenant Admins List -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-2xl font-bold mb-4">テナント管理者一覧</h2>
            <div class="flex justify-end mb-2">
                <button onclick="loadTenantAdmins()" class="text-blue-500 underline text-sm">更新</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">名前</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">テナントID</th>
                            <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- AI Config Modal -->
    <div id="ai-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-2xl rounded-lg shadow-xl p-6 relative">
            <button onclick="closeAIConfig()" class="absolute top-4 right-4 text-gray-500 hover:text-black text-xl">&times;</button>
            <h3 class="text-xl font-bold mb-4" id="ai-modal-title">AI設定</h3>

            <div class="mb-4">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="ai-enabled" class="form-checkbox h-5 w-5 text-indigo-600">
                    <span class="text-gray-900 font-bold">AI機能を利用可能にする (契約有効)</span>
                </label>
                <p class="text-sm text-gray-500 ml-7 mt-1">ここを有効にすると、テナント管理者が機能のON/OFFを選択できるようになります。</p>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Google Gemini API Key</label>
                <input type="password" id="ai-api-key" placeholder="AIzaSy..." class="w-full border p-2 rounded bg-gray-50 font-mono text-sm">
                <p class="text-xs text-gray-400 mt-1">※ このキーは安全に保存され、テナント管理者には表示されません。</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 border-t pt-4">
                <h4 class="col-span-2 font-bold text-gray-700">使用モデル設定</h4>

                <div>
                    <label class="block text-xs font-bold mb-1">毎日の記録 (分析)</label>
                    <input type="text" id="model-daily" value="gemini-3-pro-preview" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">ホワイトボード (補助)</label>
                    <input type="text" id="model-whiteboard" value="gemini-2.5-flash" class="w-full border p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">お知らせ (作成)</label>
                    <input type="text" id="model-announce" value="gemini-2.5-flash-lite" class="w-full border p-2 rounded text-sm">
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button onclick="closeAIConfig()" class="bg-gray-300 px-4 py-2 rounded">キャンセル</button>
                <button onclick="saveAIConfig()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">保存する</button>
            </div>
        </div>
    </div>

    <script>
        let currentEditingTenantId = null;

        // Security Check
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                db.collection('users').doc(user.uid).get().then(doc => {
                    if(!doc.exists || doc.data().role !== 'super_admin') {
                        alert('権限がありません');
                        window.location.href = 'login.html';
                    } else {
                        loadTenants();
                        loadTenantAdmins();
                    }
                });
            }
        });

        function togglePasswordGen() {
            const checkbox = document.getElementById('auto-generate-pass');
            const input = document.getElementById('admin-password');
            if(checkbox.checked) {
                input.value = generatePassword();
                // input.disabled = true; // Optional: disable edit
            } else {
                input.value = '';
                // input.disabled = false;
            }
        }

        async function loadTenants() {
            const list = document.getElementById('tenant-list');
            const select = document.getElementById('tenant-select');
            list.innerHTML = '';
            select.innerHTML = '<option value="">テナントを選択</option>';

            const snap = await db.collection('tenants').get();
            snap.forEach(doc => {
                const data = doc.data();
                const li = document.createElement('li');
                li.className = 'py-4 flex justify-between items-center';
                li.innerHTML = `
                    <div>
                        <p class="font-bold text-lg">${data.name}</p>
                        <p class="text-sm text-gray-500">ID: ${doc.id}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openAIConfig('${doc.id}', '${data.name}')" class="text-blue-600 border border-blue-600 px-3 py-1 rounded text-sm hover:bg-blue-50">AI設定</button>
                        <button onclick="deleteTenantFull('${doc.id}')" class="text-red-500 border border-red-500 px-3 py-1 rounded text-sm hover:bg-red-50">削除 (全データ)</button>
                    </div>
                `;
                list.appendChild(li);

                const opt = document.createElement('option');
                opt.value = doc.id;
                opt.textContent = data.name;
                select.appendChild(opt);
            });
        }

        async function createTenantWithAdmin() {
            const tenantName = document.getElementById('new-tenant-name').value;
            const adminName = document.getElementById('admin-name').value;
            const adminEmail = document.getElementById('admin-email').value;
            const adminPass = document.getElementById('admin-password').value;

            if (!tenantName || !adminName || !adminEmail || !adminPass) {
                return alert('全ての項目を入力してください');
            }

            if(!confirm(`テナント: ${tenantName}\n管理者: ${adminEmail}\n\n作成しますか？`)) return;

            try {
                // 1. Create Tenant Doc
                const tenantRef = await db.collection('tenants').add({
                    name: tenantName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 2. Create Admin User Directly
                await createAccountDirectly(
                    db,
                    adminEmail,
                    adminPass,
                    adminName,
                    'tenant_admin',
                    { tenantId: tenantRef.id }
                );

                alert(`テナントと管理者を作成しました。\nEmail: ${adminEmail}\nPass: ${adminPass}`);

                // Reset form
                document.getElementById('new-tenant-name').value = '';
                document.getElementById('admin-name').value = '';
                document.getElementById('admin-email').value = '';
                document.getElementById('admin-password').value = '';
                document.getElementById('auto-generate-pass').checked = false;

                loadTenants();
                loadTenantAdmins();

            } catch (e) {
                console.error(e);
                alert('作成失敗: ' + e.message);
            }
        }

        async function deleteTenantFull(id) {
            if(!confirm("警告: テナントを削除すると、紐づく学校、クラス、ユーザー、記録など全てのデータが削除されます。\n\n本当に削除しますか？")) return;

            try {
                await deleteTenantAndData(db, id);
                alert("テナントと関連データを全て削除しました。");
                loadTenants();
                loadTenantAdmins();
            } catch (e) {
                console.error(e);
                alert("削除中にエラーが発生しました: " + e.message);
            }
        }

        async function addTenantAdminDirectly() {
            const tenantId = document.getElementById('tenant-select').value;
            const name = document.getElementById('direct-admin-name').value;
            const email = document.getElementById('direct-admin-email').value;
            const pass = document.getElementById('direct-admin-password').value;

            if (!tenantId || !name || !email || !pass) return alert('全ての項目を入力してください');

            try {
                await createAccountDirectly(
                    db,
                    email,
                    pass,
                    name,
                    'tenant_admin',
                    { tenantId: tenantId }
                );
                alert(`管理者を追加しました。\nEmail: ${email}\nPass: ${pass}`);
                document.getElementById('direct-admin-name').value = '';
                document.getElementById('direct-admin-email').value = '';
                document.getElementById('direct-admin-password').value = '';
                loadTenantAdmins();
            } catch (e) {
                console.error(e);
                alert('追加失敗: ' + e.message);
            }
        }

        async function loadTenantAdmins() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '<tr><td colspan="4" class="p-4 text-center">読み込み中...</td></tr>';

            try {
                const snap = await db.collection('users').where('role', '==', 'tenant_admin').orderBy('createdAt', 'desc').limit(50).get();

                list.innerHTML = '';
                if(snap.empty) {
                    list.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">管理者がいません</td></tr>';
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">${data.name || '-'}</td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm font-mono">${data.email}</td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-gray-500 font-mono text-xs">${data.tenantId}</td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                             <button onclick="deleteUserFull('${doc.id}')" class="text-red-500 hover:underline">削除</button>
                        </td>
                    `;
                    list.appendChild(tr);
                });
            } catch(e) {
                console.error(e);
                list.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">読み込みエラー (インデックス作成待ちの可能性あり)</td></tr>';
            }
        }

        async function deleteUserFull(uid) {
             if(!confirm("この管理者を削除しますか？(アカウント無効化・データ削除)")) return;
             try {
                await deleteUserAndData(db, uid);
                loadTenantAdmins();
             } catch(e) {
                 alert("削除失敗: " + e.message);
             }
        }

        // --- AI Configuration Logic ---
        async function openAIConfig(tenantId, name) {
            currentEditingTenantId = tenantId;
            document.getElementById('ai-modal').classList.remove('hidden');
            document.getElementById('ai-modal-title').textContent = `AI設定: ${name}`;

            // Reset
            document.getElementById('ai-enabled').checked = false;
            document.getElementById('ai-api-key').value = '';
            document.getElementById('model-daily').value = 'gemini-3-pro-preview';
            document.getElementById('model-whiteboard').value = 'gemini-2.5-flash';
            document.getElementById('model-announce').value = 'gemini-2.5-flash-lite';

            try {
                // 1. Check Public Config (Enabled Status)
                const doc = await db.collection('tenants').doc(tenantId).get();
                if (doc.exists && doc.data().aiSettings) {
                    document.getElementById('ai-enabled').checked = doc.data().aiSettings.contractEnabled || false;
                }

                // 2. Check Private Config (Key & Models) - subcollection
                const privDoc = await db.collection('tenants').doc(tenantId).collection('private_config').doc('ai').get();
                if (privDoc.exists) {
                    const d = privDoc.data();
                    if(d.apiKey) document.getElementById('ai-api-key').value = d.apiKey;
                    if(d.models) {
                        if(d.models.daily) document.getElementById('model-daily').value = d.models.daily;
                        if(d.models.whiteboard) document.getElementById('model-whiteboard').value = d.models.whiteboard;
                        if(d.models.announce) document.getElementById('model-announce').value = d.models.announce;
                    }
                }
            } catch(e) {
                console.error("Error loading AI config:", e);
                alert("設定の読み込みに失敗しました");
            }
        }

        function closeAIConfig() {
            document.getElementById('ai-modal').classList.add('hidden');
            currentEditingTenantId = null;
        }

        async function saveAIConfig() {
            if (!currentEditingTenantId) return;

            const enabled = document.getElementById('ai-enabled').checked;
            const apiKey = document.getElementById('ai-api-key').value;
            const models = {
                daily: document.getElementById('model-daily').value,
                whiteboard: document.getElementById('model-whiteboard').value,
                announce: document.getElementById('model-announce').value
            };

            if (enabled && !apiKey) {
                return alert("AI機能を有効にする場合は、API Keyを入力してください");
            }

            try {
                // 1. Update Public Doc (Contract Status)
                await db.collection('tenants').doc(currentEditingTenantId).set({
                    aiSettings: {
                        contractEnabled: enabled
                    }
                }, { merge: true });

                // 2. Update Private Doc (Key & Models)
                await db.collection('tenants').doc(currentEditingTenantId).collection('private_config').doc('ai').set({
                    apiKey: apiKey,
                    models: models,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                alert("設定を保存しました");
                closeAIConfig();
            } catch(e) {
                console.error(e);
                alert("保存失敗: " + e.message);
            }
        }
    </script>
</body>
</html>
