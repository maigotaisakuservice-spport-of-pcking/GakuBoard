<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board 生徒機能ホーム</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>

    <style>
        /* Reusing styles from original but keeping them cleaner */
        body { background-color: #f4f7f6; min-height: 100vh; }
        .main-hub-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .hub-header { margin-bottom: 30px; border-bottom: 3px solid #00b894; padding-bottom: 15px; }
        .hub-header h1 { color: #27ae60; margin-top: 0; }
        
        .activity-section { margin-bottom: 40px; }
        .activity-section h2 { color: #34495e; font-size: 1.5em; margin-bottom: 20px; }
        
        .activity-card {
            display: flex; justify-content: space-between; align-items: center;
            background-color: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05); margin-bottom: 15px;
        }
        .live-card { border-left: 5px solid #e67e22; }
        .todo-card { border-left: 5px solid #3498db; }
        
        .status { font-weight: bold; color: #e67e22; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color:white; }
        .btn-action { background-color: #2ecc71; }
        .btn-view { background-color: #3498db; }
        
        .nav-link { cursor: pointer; margin-right: 15px; text-decoration: none; color: #333; font-weight: bold;}
    </style>
</head>
<body>

    <div class="main-hub-container">
        <header class="hub-header">
            <h1>GAKU-Board アクティビティ</h1>
            <p id="welcomeMsg">ようこそ、読み込み中...</p>
            <div style="margin-top:10px;">
                 <a onclick="location.reload()" class="nav-link"><i class="fas fa-sync"></i> 更新</a>
                 <a onclick="auth.signOut().then(()=>window.location.href='student-login.html')" class="nav-link"><i class="fas fa-sign-out-alt"></i> ログアウト</a>
            </div>
        </header>

        <div class="activity-section">
            <h2><i class="fas fa-running"></i> ライブ授業 (ホワイトボード・画面共有)</h2>
            <div id="liveList" class="activity-list">
                <!-- Live Whiteboards & Screen Shares -->
                <p>現在ライブ中のセッションはありません。</p>
            </div>
        </div>

        <div class="activity-section">
            <h2><i class="fas fa-tasks"></i> やること (ToDo)</h2>
            <div id="todoList" class="activity-list">
                <!-- Webhook/Teacher ToDos -->
            </div>
        </div>

        <div class="activity-section">
            <h2><i class="fas fa-lightbulb"></i> 意見・投票</h2>
            <div id="voteList" class="activity-list">
                <!-- Votes & Suggestions -->
            </div>
        </div>

    </div>

    <script>
        let currentUser = null;

        auth.onAuthStateChanged(async user => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                currentUser = userDoc.data();
                if(!currentUser || currentUser.role !== 'student') {
                    window.location.href = 'student-login.html';
                    return;
                }
                document.getElementById('welcomeMsg').textContent = `ようこそ、${currentUser.name} さん`;

                loadActivities();
            } else {
                window.location.href = 'student-login.html';
            }
        });

        function loadActivities() {
            // Load Live Whiteboards & ScreenShares
            db.collection('activities')
                .where('tenantId', '==', currentUser.tenantId)
                .where('type', 'in', ['whiteboard', 'screenshare'])
                .where('status', '==', 'live')
                .onSnapshot(snapshot => {
                    const list = document.getElementById('liveList');
                    list.innerHTML = '';
                    if(snapshot.empty) list.innerHTML = '<p>現在ライブ中のセッションはありません。</p>';

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        let title, icon, action;

                        if(data.type === 'whiteboard') {
                            title = `${data.teacherName}先生のホワイトボード`;
                            icon = 'fa-chalkboard';
                            action = `joinWhiteboard('${data.roomId}')`;
                        } else {
                            title = `${data.teacherName}先生の画面共有`;
                            icon = 'fa-desktop';
                            action = `joinScreenShare('${data.roomId}')`;
                        }

                        list.innerHTML += `
                            <div class="activity-card live-card">
                                <div class="card-info">
                                    <h4><i class="fas ${icon}"></i> ${title}</h4>
                                    <p class="status">配信中</p>
                                </div>
                                <button class="btn btn-action" onclick="${action}">
                                    <i class="fas fa-sign-in-alt"></i> 参加する
                                </button>
                            </div>
                        `;
                    });
                });

            // Load ToDos (Webhook items)
            db.collection('activities')
                .where('tenantId', '==', currentUser.tenantId)
                .where('type', '==', 'todo')
                .orderBy('createdAt', 'desc')
                .limit(5)
                .onSnapshot(snapshot => {
                    const list = document.getElementById('todoList');
                    list.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        list.innerHTML += `
                            <div class="activity-card todo-card">
                                <div class="card-info">
                                    <h4>${data.title}</h4>
                                    <p>${data.description || ''}</p>
                                </div>
                                <button class="btn btn-view" onclick="alert('詳細確認画面へ (未実装)')">詳細</button>
                            </div>
                        `;
                    });
                });

            // Load Votes/Suggestions
            db.collection('activities')
                .where('tenantId', '==', currentUser.tenantId)
                .where('type', 'in', ['vote', 'suggestion'])
                .where('status', '==', 'active')
                .onSnapshot(snapshot => {
                    const list = document.getElementById('voteList');
                    list.innerHTML = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const icon = data.type === 'vote' ? 'fa-poll' : 'fa-box-open';
                        const action = data.type === 'vote' ? '投票する' : '投稿する';

                        list.innerHTML += `
                            <div class="activity-card">
                                <div class="card-info">
                                    <h4><i class="fas ${icon}"></i> ${data.title}</h4>
                                </div>
                                <button class="btn btn-view" onclick="alert('${action} (詳細画面へ)')">${action}</button>
                            </div>
                        `;
                    });
                });
        }

        function joinWhiteboard(roomId) {
            window.location.href = `whiteboard.html?room=${roomId}&role=student`;
        }

        function joinScreenShare(roomId) {
            window.location.href = `screenshare.html?room=${roomId}&role=student`;
        }
    </script>
</body>
</html>
