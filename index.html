<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board | 学校運営DXプラットフォーム</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
    
    <!-- Hero -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-800 text-white pb-20 pt-10">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-5xl font-bold mb-4">GAKU-Board</h1>
            <h2 class="text-2xl font-light mb-8">アナログな学校運営を「共感」と「データ」でDXする。</h2>
            <p class="mb-8 text-blue-100">生徒の声が学校を変える、統合デジタルプラットフォーム。</p>
            <div class="flex justify-center gap-4">
                <a href="login.html" class="bg-yellow-400 text-yellow-900 font-bold py-3 px-8 rounded-full hover:bg-yellow-300 transition shadow-lg transform hover:scale-105">
                    👉 ログインして始める
                </a>
            </div>
        </div>
    </header>

    <!-- Concept -->
    <section class="py-16 bg-white -mt-10 rounded-t-3xl shadow-lg mx-4 md:mx-auto max-w-5xl relative z-10">
        <div class="container mx-auto px-4">
            <h3 class="text-3xl font-bold text-center mb-12 text-gray-800">GAKU-Boardが提供する価値</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="p-6 border rounded-xl hover:shadow-lg transition text-center">
                    <div class="text-4xl text-blue-500 mb-4"><i class="fas fa-school"></i></div>
                    <h4 class="text-xl font-bold mb-2">組織管理の階層化</h4>
                    <p class="text-gray-600">教育委員会(テナント)・学校・クラスの3階層で、大規模な導入にも柔軟に対応します。</p>
                </div>
                <div class="p-6 border rounded-xl hover:shadow-lg transition text-center">
                    <div class="text-4xl text-green-500 mb-4"><i class="fas fa-heartbeat"></i></div>
                    <h4 class="text-xl font-bold mb-2">毎日の健康観察</h4>
                    <p class="text-gray-600">毎朝の気分と体温をワンタップで記録。先生はクラス全員の状況を一目で把握できます。</p>
                </div>
                <div class="p-6 border rounded-xl hover:shadow-lg transition text-center">
                    <div class="text-4xl text-purple-500 mb-4"><i class="fas fa-desktop"></i></div>
                    <h4 class="text-xl font-bold mb-2">リアルタイム授業</h4>
                    <p class="text-gray-600">WebRTC技術を活用した「お絵かきボード」と「画面共有」。先生の画面を生徒の端末に強制表示し、集中力を維持します。</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gray-800 text-white py-8 text-center mt-12">
        <p>&copy; 2025 GAKU-Board 開発チーム</p>
    </footer>

</body>
</html>
