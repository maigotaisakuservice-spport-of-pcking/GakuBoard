<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAKU-Talk 会議</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <style>
        .video-wrapper { position: relative; border-radius: 0.75rem; overflow: hidden; background: #1f2937; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .name-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .speaking { border: 3px solid #10b981; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden">

    <header class="p-4 bg-gray-800 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <span class="bg-green-600 px-2 py-1 rounded text-xs font-bold animate-pulse">LIVE</span>
            <h1 id="room-name" class="font-bold">会議中...</h1>
        </div>
        <div id="participant-count" class="text-sm text-gray-400 font-medium">参加者: 0名</div>
    </header>

    <main id="video-grid" class="flex-grow p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto content-start">
        <!-- Local Video -->
        <div class="video-wrapper border-2 border-indigo-500" id="local-video-container">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="name-tag">あなた (自分)</div>
        </div>
    </main>

    <footer class="h-24 bg-gray-800 border-t border-gray-700 flex justify-center items-center gap-6 px-4">
        <button onclick="toggleMic()" id="btn-mic" class="p-4 bg-gray-700 rounded-full hover:bg-gray-600 transition shadow-lg">
            <span id="icon-mic" class="text-xl">🎙️</span>
        </button>
        <button onclick="toggleCam()" id="btn-cam" class="p-4 bg-gray-700 rounded-full hover:bg-gray-600 transition shadow-lg">
            <span id="icon-cam" class="text-xl">📹</span>
        </button>
        <button onclick="toggleShare()" id="btn-share" class="p-4 bg-gray-700 rounded-full hover:bg-gray-600 transition shadow-lg">
            <span id="icon-share" class="text-xl">📺</span>
        </button>
        <button onclick="hangup()" class="p-4 bg-red-600 rounded-full hover:bg-red-700 transition shadow-lg px-8">
            <span class="font-bold">退室</span>
        </button>
    </footer>

    <script src="js/meeting.js"></script>
</body>
</html>
