<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テナント管理画面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-utils.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-800 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">テナント管理 (学校管理)</h1>
        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded">ログアウト</button>
    </nav>

    <div class="container mx-auto p-8">

        <!-- Tabs (Removed MEXCBT/Settings) -->
        <div class="flex border-b border-gray-300 mb-6">
            <button onclick="switchTab('school')" id="tab-school" class="px-6 py-2 bg-white border-t border-l border-r rounded-t text-indigo-700 font-bold">学校管理</button>
        </div>

        <!-- TAB: SCHOOL MANAGEMENT -->
        <div id="content-school">
            <div id="tenant-info" class="mb-8 p-4 bg-white rounded shadow flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">読み込み中...</h2>

                <!-- AI Toggle for Tenant Admin -->
                <div id="ai-toggle-container" class="hidden flex items-center bg-gray-50 px-4 py-2 rounded border">
                     <span class="font-bold text-gray-700 mr-3">AI機能 (全校):</span>
                     <button id="btn-ai-toggle" onclick="toggleTenantAI()" class="bg-gray-400 text-white px-3 py-1 rounded text-sm font-bold">OFF</button>
                </div>
            </div>

            <!-- Create School Section -->
            <div class="bg-white p-6 rounded shadow mb-8">
                <h2 class="text-2xl font-bold mb-4">新規学校作成</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-gray-700 text-sm font-bold mb-2">学校名</label>
                        <input type="text" id="new-school-name" placeholder="例: 渋谷小学校" class="w-full border p-2 rounded">
                    </div>

                    <div class="col-span-2 border-t pt-4 mt-2">
                        <h3 class="text-lg font-bold mb-2">学校管理者作成 (同時作成)</h3>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">管理者名</label>
                        <input type="text" id="admin-name" placeholder="校長 先生" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">メールアドレス</label>
                        <input type="email" id="admin-email" placeholder="principal@example.com" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">パスワード</label>
                        <input type="text" id="admin-password" placeholder="パスワード" class="w-full border p-2 rounded">
                        <label class="inline-flex items-center mt-1">
                            <input type="checkbox" id="auto-generate-pass" class="form-checkbox h-4 w-4 text-blue-600" onchange="togglePasswordGen()">
                            <span class="ml-2 text-gray-600 text-sm">自動生成</span>
                        </label>
                    </div>
                    <div class="flex items-end">
                        <button onclick="createSchoolWithAdmin()" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 w-full">学校作成＆管理者登録</button>
                    </div>
                </div>
            </div>

            <!-- Schools List -->
            <div class="bg-white p-6 rounded shadow mb-8">
                <h3 class="text-lg font-bold mb-4">学校一覧 & 設定</h3>
                <div class="overflow-x-auto">
                    <table class="min-w-full leading-normal">
                        <thead>
                            <tr>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">学校名</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">毎日の記録機能</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">管理者確認</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="school-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- School Admin View Modal -->
        <div id="admin-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="mt-3 text-center">
                    <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-school-name">学校管理者</h3>
                    <div class="mt-2 text-left" id="admin-list-container">
                        <p class="text-sm text-gray-500">読み込み中...</p>
                    </div>
                    <div class="items-center px-4 py-3">
                        <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300">
                            閉じる
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentTenantId = null;

        // Tab Switching (Simplified)
        function switchTab(tabId) {
            // Only school tab remains
        }

        auth.onAuthStateChanged(async user => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    if (userDoc.data().role !== 'tenant_admin' && userDoc.data().role !== 'super_admin') {
                         alert('権限がありません');
                         window.location.href = 'login.html';
                         return;
                    }
                    currentTenantId = userDoc.data().tenantId;
                    loadTenantInfo();
                    loadSchools();
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function togglePasswordGen() {
            const checkbox = document.getElementById('auto-generate-pass');
            const input = document.getElementById('admin-password');
            if(checkbox.checked) {
                input.value = generatePassword();
            } else {
                input.value = '';
            }
        }

        async function loadTenantInfo() {
            const doc = await db.collection('tenants').doc(currentTenantId).get();
            if (doc.exists) {
                const data = doc.data();
                document.querySelector('#tenant-info h2').textContent = `テナント: ${data.name}`;

                // AI Settings check
                if (data.aiSettings && data.aiSettings.contractEnabled) {
                    const container = document.getElementById('ai-toggle-container');
                    container.classList.remove('hidden');

                    const isUsageOn = data.aiSettings.usageEnabled === true;
                    updateAIToggleUI(isUsageOn);
                }
            }
        }

        function updateAIToggleUI(isOn) {
            const btn = document.getElementById('btn-ai-toggle');
            if(isOn) {
                btn.textContent = "ON";
                btn.className = "bg-indigo-600 text-white px-3 py-1 rounded text-sm font-bold hover:bg-indigo-700";
            } else {
                btn.textContent = "OFF";
                btn.className = "bg-gray-400 text-white px-3 py-1 rounded text-sm font-bold hover:bg-gray-500";
            }
        }

        async function toggleTenantAI() {
            const btn = document.getElementById('btn-ai-toggle');
            const currentState = btn.textContent === "ON";
            const newState = !currentState;

            try {
                await db.collection('tenants').doc(currentTenantId).set({
                    aiSettings: {
                        usageEnabled: newState
                    }
                }, { merge: true });
                updateAIToggleUI(newState);
            } catch(e) {
                alert("更新失敗: " + e.message);
            }
        }

        async function loadSchools() {
            const list = document.getElementById('school-list');
            list.innerHTML = '';

            const snap = await db.collection('schools').where('tenantId', '==', currentTenantId).get();
            snap.forEach(doc => {
                const data = doc.data();
                const tr = document.createElement('tr');

                const isDailyRecordEnabled = data.features && data.features.dailyRecord === true;
                const statusText = isDailyRecordEnabled ? '<span class="text-green-600 font-bold">有効</span>' : '<span class="text-gray-400">無効</span>';
                const toggleBtnText = isDailyRecordEnabled ? '無効にする' : '有効にする';
                const toggleBtnColor = isDailyRecordEnabled ? 'bg-gray-500' : 'bg-green-500';

                tr.innerHTML = `
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <p class="text-gray-900 whitespace-no-wrap">${data.name}</p>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <p class="text-gray-600 whitespace-no-wrap">${doc.id}</p>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        ${statusText}
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <button onclick="viewSchoolAdmins('${doc.id}', '${data.name}')" class="bg-blue-500 text-white px-3 py-1 rounded text-xs hover:bg-blue-600">確認</button>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm flex gap-2">
                        <button onclick="toggleDailyRecord('${doc.id}', ${!isDailyRecordEnabled})" class="${toggleBtnColor} text-white px-3 py-1 rounded text-xs hover:opacity-80">${toggleBtnText}</button>
                        <button onclick="deleteSchoolFull('${doc.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">削除</button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        async function viewSchoolAdmins(schoolId, schoolName) {
            document.getElementById('modal-school-name').textContent = `${schoolName} の管理者`;
            document.getElementById('admin-modal').classList.remove('hidden');
            const container = document.getElementById('admin-list-container');
            container.innerHTML = '<p class="text-sm text-gray-500">読み込み中...</p>';

            try {
                const snap = await db.collection('users')
                    .where('role', '==', 'school_admin')
                    .where('schoolId', '==', schoolId)
                    .get();

                if (snap.empty) {
                    container.innerHTML = '<p class="text-sm text-gray-500">管理者が設定されていません</p>';
                    return;
                }

                container.innerHTML = '';
                const ul = document.createElement('ul');
                ul.className = "list-disc pl-5";

                snap.forEach(doc => {
                    const d = doc.data();
                    const li = document.createElement('li');
                    li.className = "mb-2 text-sm";
                    li.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span>${d.name} (${d.email})</span>
                            <button onclick="deleteUser('${doc.id}')" class="text-red-500 text-xs hover:underline ml-2">削除</button>
                        </div>
                    `;
                    ul.appendChild(li);
                });
                container.appendChild(ul);

            } catch(e) {
                console.error(e);
                container.innerHTML = '<p class="text-red-500">エラーが発生しました</p>';
            }
        }

        async function createSchoolWithAdmin() {
            const schoolName = document.getElementById('new-school-name').value;
            const adminName = document.getElementById('admin-name').value;
            const adminEmail = document.getElementById('admin-email').value;
            const adminPass = document.getElementById('admin-password').value;

            if (!schoolName || !adminName || !adminEmail || !adminPass) return alert('全ての項目を入力してください');

            try {
                // Simplified features (removed google/teams/mexcbt)
                const schoolRef = await db.collection('schools').add({
                    name: schoolName,
                    tenantId: currentTenantId,
                    features: { dailyRecord: true },
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                await createAccountDirectly(db, adminEmail, adminPass, adminName, 'school_admin', {
                    tenantId: currentTenantId, schoolId: schoolRef.id
                });

                alert(`作成完了: ${adminEmail}`);
                document.getElementById('new-school-name').value = '';
                loadSchools();
            } catch (e) {
                alert('作成失敗: ' + e.message);
            }
        }

        async function deleteSchoolFull(id) {
            if(!confirm("削除しますか？")) return;
            await deleteSchoolAndData(db, id);
            loadSchools();
        }

        async function toggleDailyRecord(schoolId, newState) {
            try {
                await db.collection('schools').doc(schoolId).update({
                    'features.dailyRecord': newState
                });
                loadSchools();
            } catch (e) {
                console.error(e);
                alert('更新失敗');
            }
        }
    </script>
</body>
</html>
