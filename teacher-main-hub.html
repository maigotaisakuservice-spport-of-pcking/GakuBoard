<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board | 先生用ダッシュボード</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>

    <style>
        .teacher-hub-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #2ecc71;
            border-bottom: 3px solid #2ecc71;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
        }
        .webhook-url {
            background: #f8f9fa;
            padding: 10px;
            border: 1px dashed #ccc;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="teacher-hub-container">
        <div class="header-controls">
            <div>
                <h2 id="schoolName">読み込み中...</h2>
                <p id="teacherName">ようこそ</p>
            </div>
            <div>
                <button onclick="launchWhiteboard()" class="btn btn-primary"><i class="fas fa-chalkboard"></i> ホワイトボード開始</button>
                <button onclick="launchScreenShare()" class="btn btn-action"><i class="fas fa-desktop"></i> 画面共有を開始</button>
                <button onclick="auth.signOut().then(()=>window.location.href='teacher-login.html')" class="btn btn-secondary">ログアウト</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('classes')">クラス・生徒管理</button>
            <button class="tab-btn" onclick="switchTab('activities')">活動管理</button>
            <button class="tab-btn" onclick="switchTab('settings')">Webhook・設定</button>
            <button class="tab-btn" onclick="switchTab('contract')">契約情報</button>
        </div>

        <!-- Tab 1: Class & Student Management -->
        <div id="classes" class="tab-content active">
            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <h3><i class="fas fa-users"></i> 生徒一覧 (ホワイトリスト)</h3>
                    <button onclick="showAddUserModal('student')" class="btn btn-action">+ 生徒を追加</button>
                </div>
                <div id="studentList">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <h3><i class="fas fa-chalkboard-teacher"></i> 先生一覧</h3>
                    <button onclick="showAddUserModal('teacher')" class="btn btn-action">+ 先生を追加</button>
                </div>
                <div id="teacherList"></div>
            </div>
        </div>

        <!-- Tab 2: Activity Management -->
        <div id="activities" class="tab-content">
            <div class="card">
                <h3>新規アクティビティ作成</h3>
                <button onclick="createActivity('vote')" class="btn btn-primary">投票を作成</button>
                <button onclick="createActivity('suggestion')" class="btn btn-primary">意見箱を作成</button>
                <button onclick="createActivity('todo')" class="btn btn-primary">ToDoタスク配信</button>
            </div>
            <div id="activeActivitiesList">
                <!-- List of running votes/surveys -->
            </div>
        </div>

        <!-- Tab 3: Webhook & Settings -->
        <div id="settings" class="tab-content">
            <div class="card">
                <h3><i class="fas fa-project-diagram"></i> Webhook連携設定</h3>
                <p>TeamsやGoogle Classroomからの通知を受け取るためのURLです。</p>
                <div class="webhook-url" id="webhookUrlDisplay">Loading...</div>
                <p style="font-size:0.9em; color:#666; margin-top:5px;">
                    このURLに対してJSONデータをPOSTすると、自動的に「ToDoリスト」または「お知らせ」に追加されます。
                </p>
                <button onclick="regenerateToken()" class="btn btn-secondary" style="margin-top:10px;">トークン再発行</button>
            </div>
        </div>
        
        <!-- Tab 4: Contract Info -->
        <div id="contract" class="tab-content">
            <div class="card" id="contractInfo">
                Loading...
            </div>
        </div>

    </div>

    <!-- Add User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">ユーザー追加</h3>
            <input type="text" id="newUserName" class="form-control" placeholder="名前" style="margin-bottom:10px;">
            <input type="email" id="newUserEmail" class="form-control" placeholder="メールアドレス" style="margin-bottom:10px;">
            <div style="text-align:right;">
                <button onclick="closeUserModal()" class="btn btn-secondary">キャンセル</button>
                <button onclick="saveUser()" class="btn btn-action">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let tenantData = null;
        let modalRole = 'student';

        auth.onAuthStateChanged(async user => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                currentUser = userDoc.data();

                if(!currentUser || (currentUser.role !== 'teacher' && currentUser.role !== 'admin')) {
                    alert('権限がありません');
                    window.location.href = 'teacher-login.html';
                    return;
                }

                document.getElementById('teacherName').textContent = `${currentUser.name} 先生`;

                // Fetch Tenant Info
                const tenantDoc = await db.collection('tenants').doc(currentUser.tenantId).get();
                tenantData = tenantDoc.data();
                document.getElementById('schoolName').textContent = tenantData.name;

                loadUsers();
                loadWebhookSettings();
                loadContractInfo();
            } else {
                window.location.href = 'teacher-login.html';
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        /* --- User Management --- */
        function showAddUserModal(role) {
            modalRole = role;
            document.getElementById('modalTitle').textContent = role === 'student' ? '生徒を追加' : '先生を追加';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        async function saveUser() {
            const name = document.getElementById('newUserName').value;
            const email = document.getElementById('newUserEmail').value;

            if(!name || !email) return alert('入力してください');

            try {
                // Create a placeholder doc with auto-ID (or email as ID? Better Auto-ID for privacy but need to query by email)
                // We'll use Auto-ID but query by email in login flow.
                await db.collection('users').add({
                    name: name,
                    email: email,
                    role: modalRole,
                    tenantId: currentUser.tenantId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('追加しました');
                closeUserModal();
                loadUsers();
            } catch(e) {
                alert('Error: ' + e.message);
            }
        }

        function loadUsers() {
            const sList = document.getElementById('studentList');
            const tList = document.getElementById('teacherList');
            sList.innerHTML = '';
            tList.innerHTML = '';

            db.collection('users')
                .where('tenantId', '==', currentUser.tenantId)
                .orderBy('createdAt', 'desc') // Requires index, might fail first time
                .onSnapshot(snapshot => {
                    sList.innerHTML = '';
                    tList.innerHTML = '';
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        const html = `
                            <div class="user-list-item">
                                <div>
                                    <strong>${d.name}</strong> (${d.email})
                                    ${d.uid ? '<span style="color:green; font-size:0.8em;">(登録済)</span>' : '<span style="color:red; font-size:0.8em;">(未登録)</span>'}
                                </div>
                                <button class="btn btn-secondary" style="padding:2px 8px; font-size:0.8em;" onclick="deleteUser('${doc.id}')">削除</button>
                            </div>
                        `;
                        if(d.role === 'student') sList.innerHTML += html;
                        else if(d.role === 'teacher' || d.role === 'admin') tList.innerHTML += html;
                    });
                }, error => {
                    console.log("Index error likely:", error);
                    // Fallback without ordering if index missing
                    if(error.code === 'failed-precondition') {
                         alert("初回の並び替えインデックスを作成する必要があります。コンソールを確認してください。");
                    }
                });
        }

        async function deleteUser(id) {
            if(confirm('本当に削除しますか？')) {
                await db.collection('users').doc(id).delete();
            }
        }

        /* --- Webhook --- */
        function loadWebhookSettings() {
            const url = `https://us-central1-gaku-board-for-kakera-design.cloudfunctions.net/incomingWebhook?tenantId=${currentUser.tenantId}&token=${tenantData.webhookToken}`;
            document.getElementById('webhookUrlDisplay').textContent = url;
        }

        async function regenerateToken() {
            if(!confirm('トークンを再発行すると、古いURLは使えなくなります。よろしいですか？')) return;
            const newToken = Math.random().toString(36).substring(2);
            await db.collection('tenants').doc(currentUser.tenantId).update({
                webhookToken: newToken
            });
            tenantData.webhookToken = newToken; // Local update
            loadWebhookSettings();
        }

        /* --- Contract --- */
        function loadContractInfo() {
            document.getElementById('contractInfo').innerHTML = `
                <h4>契約プラン: ${tenantData.contractPlan}</h4>
                <p>契約終了日: ${tenantData.contractEnd || '無期限'}</p>
                <p>許可された認証:
                   ${tenantData.allowedAuth.email ? '[Email]' : ''}
                   ${tenantData.allowedAuth.google ? '[Google]' : ''}
                   ${tenantData.allowedAuth.microsoft ? '[Microsoft]' : ''}
                </p>
            `;
        }

        /* --- Whiteboard Launch --- */
        function launchWhiteboard() {
            const roomId = `room-${currentUser.tenantId}-${Date.now()}`;
            // Save session to Firestore so students can see it
            db.collection('activities').add({
                type: 'whiteboard',
                tenantId: currentUser.tenantId,
                roomId: roomId,
                teacherId: currentUser.uid,
                teacherName: currentUser.name,
                status: 'live',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                target: 'all' // Default
            }).then(() => {
                window.location.href = `whiteboard.html?room=${roomId}&role=teacher`;
            });
        }

        function launchScreenShare() {
            const roomId = `ss-${currentUser.tenantId}-${Date.now()}`;
            db.collection('activities').add({
                type: 'screenshare',
                tenantId: currentUser.tenantId,
                roomId: roomId,
                teacherId: currentUser.uid,
                teacherName: currentUser.name,
                status: 'live',
                studentCanShare: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                target: 'all'
            }).then(() => {
                window.location.href = `screenshare.html?room=${roomId}&role=teacher`;
            });
        }

        function createActivity(type) {
             // Simple stub for creating activities
             const title = prompt("タイトルを入力してください");
             if(!title) return;

             db.collection('activities').add({
                type: type,
                tenantId: currentUser.tenantId,
                title: title,
                status: 'active',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                target: 'all'
             });
             alert("作成しました");
        }
    </script>
</body>
</html>
