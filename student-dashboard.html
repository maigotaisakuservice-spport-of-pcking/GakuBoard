<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAKU-Board 生徒用</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .mood-btn.selected { transform: scale(1.2); border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-blue-50 min-h-screen pb-20">

    <header class="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">S</div>
            <span id="student-name" class="font-bold text-gray-700">読み込み中...</span>
        </div>
        <button onclick="handleLogout()" class="text-sm text-red-500">ログアウト</button>
    </header>

    <main class="container mx-auto p-4 space-y-6 max-w-2xl">

        <!-- Daily Record Input -->
        <section id="daily-section" class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-yellow-400">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span>📝</span> 今日の健康かんさつ
            </h2>

            <div id="daily-form">
                <div class="mb-4">
                    <p class="font-bold text-gray-600 mb-2">今の気分は？</p>
                    <div class="flex justify-around text-4xl">
                        <button onclick="selectMood('good', this)" class="mood-btn p-2 rounded-full border-2 border-transparent transition">😊</button>
                        <button onclick="selectMood('normal', this)" class="mood-btn p-2 rounded-full border-2 border-transparent transition">😐</button>
                        <button onclick="selectMood('bad', this)" class="mood-btn p-2 rounded-full border-2 border-transparent transition">😫</button>
                    </div>
                </div>

                <div class="mb-4">
                    <p class="font-bold text-gray-600 mb-2">体温</p>
                    <div class="flex items-center gap-2">
                        <input type="number" id="temp" step="0.1" placeholder="36.5" class="border p-2 rounded text-xl w-24 text-center">
                        <span class="text-xl">℃</span>
                    </div>
                </div>

                <div class="mb-4">
                    <p class="font-bold text-gray-600 mb-2">先生へのコメント</p>
                    <input type="text" id="daily-comment" placeholder="おなかがいたいです...など" class="w-full border p-2 rounded">
                </div>

                <button onclick="submitDaily()" class="w-full bg-yellow-400 text-yellow-900 font-bold py-3 rounded-lg hover:bg-yellow-500 transition shadow">
                    送信する
                </button>
            </div>

            <div id="daily-done" class="hidden text-center py-4">
                <p class="text-2xl mb-2">✅ 送信しました</p>
                <p class="text-gray-500">今日も一日がんばろう！</p>
            </div>
        </section>

        <!-- Activity Launcher -->
        <section class="grid grid-cols-2 gap-4">
            <button onclick="joinActivity('whiteboard')" class="bg-white p-6 rounded-xl shadow border-b-4 border-blue-500 hover:bg-blue-50 transition flex flex-col items-center">
                <span class="text-4xl mb-2">🎨</span>
                <span class="font-bold text-blue-800">お絵かきボード</span>
            </button>
            <button onclick="joinActivity('screenshare')" class="bg-white p-6 rounded-xl shadow border-b-4 border-green-500 hover:bg-green-50 transition flex flex-col items-center">
                <span class="text-4xl mb-2">📺</span>
                <span class="font-bold text-green-800">先生の画面を見る</span>
            </button>
        </section>

        <!-- Learning Portal -->
        <section>
            <h2 class="text-lg font-bold text-gray-700 mb-2">学習アプリ</h2>
            <div id="portal-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-4">
                <!-- Portal Items -->
            </div>
        </section>

        <!-- Announcements -->
        <section>
            <h2 class="text-lg font-bold text-gray-700 mb-2">お知らせ</h2>
            <div id="announce-list" class="space-y-3">
                <!-- Announcements -->
            </div>
        </section>

    </main>

    <script src="js/student-dashboard.js"></script>
</body>
</html>
