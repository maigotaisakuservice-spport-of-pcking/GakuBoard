<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAKU-Board 生徒用</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile-setup.js"></script>
    <style>
        .mood-btn.selected { transform: scale(1.2); border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .nav-active { background-color: #ebf8ff; color: #2b6cb0; font-weight: bold; }
    </style>
</head>
<body class="bg-blue-50 h-screen flex overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-xl flex-shrink-0 hidden md:flex flex-col z-20">
        <div class="p-6 bg-blue-600 text-white font-bold text-xl flex items-center gap-2 shadow-inner">
            <span>🎓</span> GAKU-Board
        </div>

        <div class="p-4 border-b flex items-center gap-3 bg-gray-50">
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-lg shadow-sm">S</div>
            <div class="overflow-hidden">
                <p id="nav-student-name" class="font-bold text-sm text-gray-800 truncate">読み込み中...</p>
                <button onclick="handleLogout()" class="text-xs text-red-500 hover:underline">ログアウト</button>
            </div>
        </div>

        <div class="p-4 border-b bg-gray-50">
            <label class="text-xs font-bold text-gray-400 block mb-1 uppercase tracking-wider">表示モード</label>
            <select id="student-context-select" class="w-full border p-2 rounded-lg text-sm bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none" onchange="switchStudentContext(this.value)">
                <!-- Populated by JS -->
            </select>
        </div>

        <nav class="flex-grow p-4 space-y-1 overflow-y-auto">
            <button onclick="showStudentSection('home')" id="nav-home" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition"><span>🏠</span> ホーム</button>

            <div class="pt-4 pb-1 text-xs font-bold text-gray-400 uppercase tracking-widest px-3">教材・学習</div>
            <button onclick="showStudentSection('apps')" id="nav-apps" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>📚</span> 教材・アプリ</button>
            <button onclick="showStudentSection('assignments')" id="nav-assignments" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>📝</span> 課題・提出物</button>

            <div class="pt-4 pb-1 text-xs font-bold text-gray-400 uppercase tracking-widest px-3">コミュニケーション</div>
            <button onclick="showStudentSection('announce')" id="nav-announce" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>📢</span> お知らせ</button>
            <button onclick="showStudentSection('surveys')" id="nav-surveys" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>📊</span> アンケート</button>
            <a href="gakutalk.html" target="_blank" id="nav-gakutalk" class="w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>💬</span> GAKU-Talk</a>

            <div class="pt-4 pb-1 text-xs font-bold text-gray-400 uppercase tracking-widest px-3">記録・設定</div>
            <button onclick="showStudentSection('attendance')" id="nav-attendance" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>🌡️</span> 出欠・健康観察</button>
            <button onclick="editProfile()" class="nav-item w-full text-left p-3 rounded-xl flex items-center gap-3 transition text-gray-600 hover:bg-gray-50"><span>⚙️</span> 設定</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col h-full overflow-hidden relative">
        <header class="md:hidden bg-blue-600 text-white p-4 flex justify-between items-center shadow-md flex-shrink-0">
            <span class="font-bold">GAKU-Board</span>
            <button onclick="handleLogout()" class="text-xs bg-white text-blue-600 px-2 py-1 rounded">ログアウト</button>
        </header>

        <div class="flex-grow overflow-y-auto p-4 md:p-8 space-y-6" id="main-scroll">

            <!-- HOME Section -->
            <section id="sec-home" class="space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div id="ss-card" class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-gray-300 transition opacity-50">
                         <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-gray-700 flex items-center gap-2"><span class="text-2xl">📺</span> 先生の画面共有</h3>
                            <span id="ss-status-text" class="text-xs bg-gray-200 px-2 py-1 rounded-full text-gray-600 font-bold">待機中</span>
                         </div>
                         <button id="btn-join-ss" disabled onclick="joinActivity('screenshare')" class="w-full bg-gray-400 text-white py-3 rounded-xl font-bold cursor-not-allowed transition shadow-md">参加する</button>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-blue-500">
                        <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><span class="text-2xl">🎨</span> ホワイトボード</h3>
                        <div id="wb-list" class="space-y-2 max-h-40 overflow-y-auto pr-2">
                            <p class="text-gray-400 text-sm text-center py-4">開催中のボードはありません</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
                    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2"><span>📢</span> 最新のお知らせ</h3>
                    <div id="announce-list-home" class="space-y-4">
                        <p class="text-gray-400 text-sm">読み込み中...</p>
                    </div>
                </div>
            </section>

            <!-- APPS & MATERIALS Section -->
            <section id="sec-apps" class="hidden space-y-8 max-w-5xl mx-auto w-full">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">教材・ライブラリ</h2>
                    <div id="material-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Materials -->
                    </div>
                </div>

                <hr>

                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">学習アプリ</h2>
                    <div class="space-y-8">
                        <div>
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 ml-1">クラス・部活</h3>
                            <div id="app-grid-class" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 ml-1">学校全体</h3>
                            <div id="app-grid-school" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ASSIGNMENTS Section -->
            <section id="sec-assignments" class="hidden space-y-6 max-w-4xl mx-auto w-full">
                <h2 class="text-2xl font-bold text-gray-800">課題・提出物</h2>
                <div id="assignment-list" class="space-y-4">
                    <!-- Assignment Cards -->
                </div>
            </section>

            <!-- ANNOUNCEMENTS Section -->
            <section id="sec-announce" class="hidden space-y-6 max-w-4xl mx-auto w-full">
                <h2 class="text-2xl font-bold text-gray-800">お知らせ一覧</h2>
                <div id="announce-list-full" class="space-y-4"></div>
            </section>

            <!-- SURVEYS Section -->
            <section id="sec-surveys" class="hidden space-y-6 max-w-4xl mx-auto w-full">
                <h2 class="text-2xl font-bold text-gray-800">アンケート</h2>
                <div id="survey-list" class="space-y-4"></div>
            </section>

            <!-- ATTENDANCE & DAILY Section -->
            <section id="sec-attendance" class="hidden space-y-6 max-w-2xl mx-auto w-full">
                <h2 class="text-2xl font-bold text-gray-800">出欠・健康観察</h2>
                <div class="flex border-b mb-4 bg-white rounded-t-xl overflow-hidden shadow-sm">
                    <button onclick="switchAttendTab('daily')" id="tab-daily" class="flex-1 py-4 border-b-4 border-blue-500 text-blue-600 font-bold">毎日の記録</button>
                    <button onclick="switchAttendTab('absent')" id="tab-absent" class="flex-1 py-4 border-b-4 border-transparent text-gray-400 font-bold transition">欠席・遅刻連絡</button>
                </div>

                <div id="panel-daily">
                    <div class="bg-white p-8 rounded-b-xl shadow-lg border-t-4 border-yellow-400">
                        <div id="daily-form">
                            <div class="mb-8 text-center">
                                <p class="font-bold text-gray-500 mb-6 uppercase tracking-wider text-sm">今の気分は？</p>
                                <div class="flex justify-center gap-10">
                                    <button onclick="selectMood('good', this)" class="mood-btn text-6xl p-4 rounded-full hover:bg-yellow-50 transition transform hover:scale-110">😊</button>
                                    <button onclick="selectMood('normal', this)" class="mood-btn text-6xl p-4 rounded-full hover:bg-gray-50 transition transform hover:scale-110">😐</button>
                                    <button onclick="selectMood('bad', this)" class="mood-btn text-6xl p-4 rounded-full hover:bg-red-50 transition transform hover:scale-110">😫</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div>
                                    <label class="block font-bold text-gray-500 mb-2 text-xs uppercase">体温 (℃)</label>
                                    <input type="number" id="temp" step="0.1" placeholder="36.5" class="w-full border-2 border-gray-100 p-4 rounded-xl text-3xl text-center font-mono focus:border-blue-400 outline-none transition">
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-500 mb-2 text-xs uppercase">コメント</label>
                                    <input type="text" id="daily-comment" placeholder="先生にひとこと" class="w-full border-2 border-gray-100 p-4 rounded-xl h-full focus:border-blue-400 outline-none transition">
                                </div>
                            </div>
                            <button onclick="submitDaily()" class="w-full bg-yellow-400 text-yellow-900 font-bold py-4 rounded-xl hover:bg-yellow-500 shadow-xl transition transform active:scale-95">送信する</button>
                        </div>
                        <div id="daily-done" class="hidden text-center py-12">
                            <p class="text-6xl mb-4">✨</p>
                            <p class="font-bold text-2xl text-gray-800">送信完了しました！</p>
                            <p class="text-gray-500 mt-2">今日も一日頑張りましょう</p>
                        </div>
                    </div>
                </div>

                <div id="panel-absent" class="hidden">
                    <div class="bg-white p-8 rounded-b-xl shadow-lg border-t-4 border-red-400">
                        <div class="space-y-6">
                            <div>
                                <label class="block font-bold text-gray-500 mb-2 text-xs uppercase">日付</label>
                                <input type="date" id="attend-date" class="w-full border-2 border-gray-100 p-3 rounded-xl bg-gray-50">
                            </div>
                            <div>
                                <label class="block font-bold text-gray-500 mb-2 text-xs uppercase">区分</label>
                                <div class="grid grid-cols-3 gap-3">
                                    <label class="border-2 border-gray-100 p-3 rounded-xl cursor-pointer hover:bg-gray-50 flex flex-col items-center gap-2 transition">
                                        <input type="radio" name="attend-type" value="absent" onchange="toggleSuspendDate(false)" checked>
                                        <span class="text-sm font-bold">欠席</span>
                                    </label>
                                    <label class="border-2 border-gray-100 p-3 rounded-xl cursor-pointer hover:bg-gray-50 flex flex-col items-center gap-2 transition">
                                        <input type="radio" name="attend-type" value="late" onchange="toggleSuspendDate(false)">
                                        <span class="text-sm font-bold">遅刻</span>
                                    </label>
                                    <label class="border-2 border-gray-100 p-3 rounded-xl cursor-pointer hover:bg-gray-50 flex flex-col items-center gap-2 transition">
                                        <input type="radio" name="attend-type" value="suspend" onchange="toggleSuspendDate(true)">
                                        <span class="text-sm font-bold">出席停止</span>
                                    </label>
                                </div>
                            </div>
                            <div id="suspend-container" class="hidden p-4 bg-red-50 rounded-xl border-2 border-red-100">
                                <label class="block font-bold text-red-600 mb-2 text-sm">いつまで休みますか？</label>
                                <input type="date" id="suspend-until" class="w-full border-2 border-white p-2 rounded-lg">
                            </div>
                            <div>
                                <label class="block font-bold text-gray-500 mb-2 text-xs uppercase">理由</label>
                                <textarea id="attend-reason" class="w-full border-2 border-gray-100 p-3 rounded-xl h-32 outline-none focus:border-red-400 transition" placeholder="体調不良のため、等"></textarea>
                            </div>
                            <button onclick="submitAttendance()" class="w-full bg-red-500 text-white font-bold py-4 rounded-xl hover:bg-red-600 shadow-xl transition transform active:scale-95">連絡を送信</button>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Modal for Submission -->
    <div id="submit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
            <h3 id="modal-assign-title" class="font-bold text-xl mb-4">課題の提出</h3>
            <p id="modal-assign-desc" class="text-sm text-gray-500 mb-6"></p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">提出URL (Googleドライブのリンク等)</label>
                    <input type="url" id="submit-url" placeholder="https://..." class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button onclick="closeSubmitModal()" class="text-gray-500 px-4 py-2 font-bold">キャンセル</button>
                    <button onclick="performSubmitAssignment()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg hover:bg-blue-700">提出する</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Survey Response Modal -->
    <div id="survey-resp-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
            <h3 id="modal-survey-title" class="font-bold text-xl mb-4">アンケート回答</h3>
            <p id="modal-survey-desc" class="text-sm text-gray-500 mb-6"></p>
            <div id="survey-options-container" class="space-y-3">
                <!-- Radio buttons -->
            </div>
            <div class="flex justify-end gap-2 pt-6">
                <button onclick="closeSurveyModal()" class="text-gray-500 px-4 py-2 font-bold">キャンセル</button>
                <button onclick="performSubmitSurvey()" class="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold shadow-lg hover:bg-blue-700">回答する</button>
            </div>
        </div>
    </div>

    <script src="js/student-dashboard.js"></script>
    <script>
        function closeSubmitModal() { document.getElementById('submit-modal').classList.add('hidden'); }
        function closeSurveyModal() { document.getElementById('survey-resp-modal').classList.add('hidden'); }
    </script>
</body>
</html>
