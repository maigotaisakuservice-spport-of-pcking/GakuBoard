<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAKU-Board 生徒用</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile-setup.js"></script>
    <style>
        .mood-btn.selected { transform: scale(1.2); border-color: #3B82F6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-blue-50 h-screen flex overflow-hidden">

    <!-- Sidebar (New) -->
    <aside class="w-64 bg-white shadow-lg flex-shrink-0 hidden md:flex flex-col z-20">
        <div class="p-6 bg-blue-600 text-white font-bold text-xl flex items-center gap-2">
            <span>🎓</span> GAKU-Board
        </div>
        <div class="p-4 border-b">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-lg">S</div>
                <div>
                    <p id="nav-student-name" class="font-bold text-sm text-gray-800">読み込み中...</p>
                    <button onclick="handleLogout()" class="text-xs text-red-500 hover:underline">ログアウト</button>
                </div>
            </div>
        </div>

        <!-- Context (Class vs Club) -->
        <div class="p-4 border-b">
            <label class="text-xs font-bold text-gray-400 block mb-1">表示モード</label>
            <select id="student-context-select" class="w-full border p-2 rounded text-sm bg-gray-50" onchange="switchStudentContext(this.value)">
                <!-- Populated by JS -->
            </select>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto">
            <button onclick="showStudentSection('home')" id="nav-home" class="nav-item w-full text-left p-3 rounded-lg bg-blue-50 text-blue-700 font-bold">🏠 ホーム</button>
            <button onclick="showStudentSection('apps')" id="nav-apps" class="nav-item w-full text-left p-3 rounded-lg text-gray-600 hover:bg-gray-50">📱 アプリ</button>
            <button onclick="showStudentSection('attendance')" id="nav-attendance" class="nav-item w-full text-left p-3 rounded-lg text-gray-600 hover:bg-gray-50">📅 出欠・健康観察</button>
            <!-- Profile Settings is handled by initial modal, but maybe add edit button? -->
            <button onclick="editProfile()" class="nav-item w-full text-left p-3 rounded-lg text-gray-600 hover:bg-gray-50">⚙️ プロフィール設定</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col h-full overflow-hidden relative">
        <!-- Mobile Header -->
        <header class="md:hidden bg-blue-600 text-white p-4 flex justify-between items-center shadow-md flex-shrink-0">
            <span class="font-bold">GAKU-Board</span>
            <button onclick="handleLogout()" class="text-xs bg-white text-blue-600 px-2 py-1 rounded">ログアウト</button>
        </header>

        <div class="flex-grow overflow-y-auto p-4 md:p-8 space-y-6" id="main-scroll">

            <!-- HOME Section -->
            <section id="sec-home" class="space-y-6">
                <!-- Activity Launcher -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Screen Share -->
                    <div id="ss-card" class="bg-white p-6 rounded-xl shadow border-l-4 border-gray-300 transition opacity-50">
                         <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-gray-700 flex items-center gap-2"><span class="text-2xl">📺</span> 先生の画面共有</h3>
                            <span id="ss-status-text" class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600">待機中</span>
                         </div>
                         <button id="btn-join-ss" disabled onclick="joinActivity('screenshare')" class="w-full bg-gray-400 text-white py-3 rounded-lg font-bold cursor-not-allowed transition">参加する</button>
                    </div>

                    <!-- Whiteboards -->
                    <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
                        <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><span class="text-2xl">🎨</span> ホワイトボード</h3>
                        <div id="wb-list" class="space-y-2 max-h-40 overflow-y-auto">
                            <p class="text-gray-400 text-sm text-center py-4">現在開催中のボードはありません</p>
                        </div>
                    </div>
                </div>

                <!-- Latest Announcements -->
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="font-bold text-gray-700 mb-4 border-b pb-2">お知らせ</h3>
                    <div id="announce-list" class="space-y-4">
                        <!-- Populated -->
                    </div>
                </div>
            </section>

            <!-- APPS Section -->
            <section id="sec-apps" class="hidden space-y-6">
                <h2 class="text-2xl font-bold text-gray-800">学習アプリ</h2>

                <!-- Categorized Apps -->
                <div class="space-y-8">
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3 ml-1">クラス・部活のアプリ</h3>
                        <div id="app-grid-class" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3 ml-1">学校全体のアプリ</h3>
                        <div id="app-grid-school" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-3 ml-1">共通アプリ (テナント)</h3>
                        <div id="app-grid-tenant" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
                    </div>
                </div>
            </section>

            <!-- ATTENDANCE & DAILY Section -->
            <section id="sec-attendance" class="hidden space-y-6 max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold text-gray-800">出欠・健康観察</h2>

                <!-- Tabs for this section -->
                <div class="flex border-b mb-4">
                    <button onclick="switchAttendTab('daily')" id="tab-daily" class="flex-1 py-2 border-b-2 border-blue-500 text-blue-600 font-bold">毎日の記録</button>
                    <button onclick="switchAttendTab('absent')" id="tab-absent" class="flex-1 py-2 border-b-2 border-transparent text-gray-500">欠席・遅刻連絡</button>
                </div>

                <!-- Daily Form -->
                <div id="panel-daily">
                    <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-400">
                        <div id="daily-form">
                            <div class="mb-6 text-center">
                                <p class="font-bold text-gray-600 mb-4">今の気分は？</p>
                                <div class="flex justify-center gap-8">
                                    <button onclick="selectMood('good', this)" class="mood-btn text-5xl p-3 rounded-full hover:bg-yellow-50 transition">😊</button>
                                    <button onclick="selectMood('normal', this)" class="mood-btn text-5xl p-3 rounded-full hover:bg-gray-50 transition">😐</button>
                                    <button onclick="selectMood('bad', this)" class="mood-btn text-5xl p-3 rounded-full hover:bg-red-50 transition">😫</button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block font-bold text-gray-600 mb-1">体温 (℃)</label>
                                <input type="number" id="temp" step="0.1" placeholder="36.5" class="w-full border p-3 rounded text-lg text-center font-mono">
                            </div>

                            <div class="mb-6">
                                <label class="block font-bold text-gray-600 mb-1">コメント</label>
                                <input type="text" id="daily-comment" placeholder="ひとこと..." class="w-full border p-3 rounded">
                            </div>

                            <button onclick="submitDaily()" class="w-full bg-yellow-400 text-yellow-900 font-bold py-3 rounded-lg hover:bg-yellow-500 shadow-md">送信する</button>
                        </div>
                        <div id="daily-done" class="hidden text-center py-8">
                            <p class="text-3xl mb-2">✅</p>
                            <p class="font-bold text-gray-800">送信完了</p>
                        </div>
                    </div>
                </div>

                <!-- Absent Form -->
                <div id="panel-absent" class="hidden">
                    <div class="bg-white p-6 rounded-xl shadow border-t-4 border-red-400">
                        <div class="mb-4">
                            <label class="block font-bold text-gray-600 mb-1">日付</label>
                            <input type="date" id="attend-date" class="w-full border p-2 rounded bg-gray-50">
                        </div>

                        <div class="mb-4">
                            <label class="block font-bold text-gray-600 mb-1">区分</label>
                            <div class="flex gap-2">
                                <label class="flex-1 border p-2 rounded cursor-pointer hover:bg-gray-50 flex items-center justify-center gap-2">
                                    <input type="radio" name="attend-type" value="absent" onchange="toggleSuspendDate(false)" checked> 欠席
                                </label>
                                <label class="flex-1 border p-2 rounded cursor-pointer hover:bg-gray-50 flex items-center justify-center gap-2">
                                    <input type="radio" name="attend-type" value="late" onchange="toggleSuspendDate(false)"> 遅刻
                                </label>
                                <label class="flex-1 border p-2 rounded cursor-pointer hover:bg-gray-50 flex items-center justify-center gap-2">
                                    <input type="radio" name="attend-type" value="suspend" onchange="toggleSuspendDate(true)"> 出席停止
                                </label>
                            </div>
                        </div>

                        <div id="suspend-container" class="mb-4 hidden p-3 bg-red-50 rounded border border-red-100">
                            <label class="block font-bold text-red-600 mb-1 text-sm">いつまで休みますか？</label>
                            <input type="date" id="suspend-until" class="w-full border p-2 rounded">
                        </div>

                        <div class="mb-4">
                            <label class="block font-bold text-gray-600 mb-1">理由</label>
                            <textarea id="attend-reason" class="w-full border p-2 rounded h-24" placeholder="熱があるため、など"></textarea>
                        </div>

                        <button onclick="submitAttendance()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg hover:bg-red-600 shadow-md">連絡する</button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="js/student-dashboard.js"></script>
    <script>
        function toggleSuspendDate(show) {
            const el = document.getElementById('suspend-container');
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }
    </script>
</body>
</html>
