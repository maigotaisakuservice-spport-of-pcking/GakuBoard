<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAKU-Board 管理コンソール (Super Admin)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .tenant-list {
            list-style: none;
            padding: 0;
        }
        .tenant-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tenant-info h4 { margin: 0 0 5px 0; }
        .badge {
            background: #eee;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
        }
    </style>

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Config & Init -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1><i class="fas fa-cogs"></i> GAKU-Board 管理コンソール</h1>
                <p>サービス運営・契約管理</p>
            </div>
            <button id="logoutBtn" class="btn btn-secondary" style="display:none;">ログアウト</button>
        </div>

        <div id="loginSection" class="section">
            <h3>管理者ログイン</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminEmail" class="form-control">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" class="form-control">
            </div>
            <button onclick="adminLogin()" class="btn btn-primary">ログイン</button>
        </div>

        <div id="dashboardSection" class="section" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>テナント(学校)一覧</h3>
                <button onclick="showAddTenantModal()" class="btn btn-action"><i class="fas fa-plus"></i> 新規契約追加</button>
            </div>

            <ul id="tenantList" class="tenant-list">
                <!-- Tenants will be loaded here -->
            </ul>
        </div>
    </div>

    <!-- Add Tenant Modal -->
    <div id="tenantModal" class="modal">
        <div class="modal-content">
            <h3>新規テナント契約登録</h3>
            <div class="form-group">
                <label>学校名 / 組織名</label>
                <input type="text" id="tenantName" class="form-control" placeholder="例: 〇〇高等学校">
            </div>
            <div class="form-group">
                <label>テナントID (英数字)</label>
                <input type="text" id="tenantId" class="form-control" placeholder="例: school001">
            </div>
            <div class="form-group">
                <label>認証方法の許可</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="authEmail" checked> Email/Pass</label>
                    <label><input type="checkbox" id="authGoogle"> Google</label>
                    <label><input type="checkbox" id="authMicrosoft"> Microsoft</label>
                </div>
            </div>
            <div class="form-group">
                <label>契約プラン</label>
                <select id="contractPlan" class="form-control">
                    <option value="standard">スタンダード</option>
                    <option value="pro">プロフェッショナル</option>
                    <option value="enterprise">エンタープライズ</option>
                </select>
            </div>
            <div class="form-group">
                <label>契約終了日</label>
                <input type="date" id="contractEnd" class="form-control">
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button onclick="closeModal()" class="btn btn-secondary">キャンセル</button>
                <button onclick="saveTenant()" class="btn btn-action">保存</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const tenantList = document.getElementById('tenantList');
        const modal = document.getElementById('tenantModal');
        const logoutBtn = document.getElementById('logoutBtn');

        // Check Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                // Ideally check if user is super admin in Firestore
                // For now, assuming logged in is enough for demo logic
                // Real implementation would check user.uid against 'admins' collection
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                logoutBtn.style.display = 'block';
                loadTenants();
            } else {
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            auth.signInWithEmailAndPassword(email, pass)
                .catch(error => alert("Login Failed: " + error.message));
        }

        logoutBtn.onclick = () => auth.signOut();

        function showAddTenantModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        async function saveTenant() {
            const name = document.getElementById('tenantName').value;
            const id = document.getElementById('tenantId').value;
            const plan = document.getElementById('contractPlan').value;
            const endDate = document.getElementById('contractEnd').value;

            const allowedAuth = {
                email: document.getElementById('authEmail').checked,
                google: document.getElementById('authGoogle').checked,
                microsoft: document.getElementById('authMicrosoft').checked
            };

            if(!name || !id) {
                alert('必須項目を入力してください');
                return;
            }

            try {
                // Generate a random webhook token
                const webhookToken = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

                await db.collection('tenants').doc(id).set({
                    name: name,
                    contractPlan: plan,
                    contractEnd: endDate,
                    allowedAuth: allowedAuth,
                    webhookToken: webhookToken,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                closeModal();
                alert('テナントを作成しました');
                loadTenants(); // Reload list
            } catch (e) {
                console.error(e);
                alert('エラー: ' + e.message);
            }
        }

        function loadTenants() {
            tenantList.innerHTML = '<p>読み込み中...</p>';
            db.collection('tenants').get().then(snapshot => {
                tenantList.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const li = document.createElement('li');
                    li.className = 'tenant-item';

                    let authBadges = '';
                    if(data.allowedAuth.email) authBadges += '<span class="badge">Email</span>';
                    if(data.allowedAuth.google) authBadges += '<span class="badge">Google</span>';
                    if(data.allowedAuth.microsoft) authBadges += '<span class="badge">MS</span>';

                    li.innerHTML = `
                        <div class="tenant-info">
                            <h4>${data.name} (ID: ${doc.id})</h4>
                            <p>プラン: ${data.contractPlan} | 期限: ${data.contractEnd || '無期限'}</p>
                            <div>${authBadges}</div>
                        </div>
                        <div>
                            <button class="btn btn-view" onclick="alert('詳細・編集機能は未実装')">詳細</button>
                        </div>
                    `;
                    tenantList.appendChild(li);
                });
            });
        }
    </script>
</body>
</html>
