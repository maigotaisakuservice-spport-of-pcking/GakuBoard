<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GAKU-Board - ログイン</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">GAKU-Board</h1>

        <div id="error-message" class="bg-red-100 text-red-700 p-3 rounded mb-4 hidden"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">メールアドレス</label>
                <input type="email" id="email" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">パスワード</label>
                <input type="password" id="password" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">
                ログイン
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400">または</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded hover:bg-red-600 transition flex justify-center items-center">
                Googleでログイン
            </button>
            <button onclick="handleMicrosoftLogin()" class="w-full bg-gray-800 text-white font-bold py-2 px-4 rounded hover:bg-gray-900 transition flex justify-center items-center">
                Microsoftでログイン
            </button>
        </div>

        <div class="mt-4 text-center">
            <a href="seed.html" class="text-xs text-gray-400 hover:text-gray-600">管理者初期セットアップ (初回のみ)</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
